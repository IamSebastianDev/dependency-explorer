pre-commit:
    parallel: true
    commands:
        format:
            run: bun run format:check
        lint:
            run: bun run lint

commit-msg:
    commands:
        commitlint:
            run: bunx commitlint --edit {1}

pre-push:
    parallel: true
    commands:
        types:
            run: bun run check
        tests:
            run: bun test
